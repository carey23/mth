<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>도서출판본부 월간계획표</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 일~토 달력을 부드러운 카드 격자로 구성한다. 날짜마다 둥근 카드, 도서는 조판자 색의 알약 카드로 쌓인다.
   위쪽에 월/연간/도서 이력 전환 막대를 두고, 좁은 화면(모바일)에서는 주간 격자가 날짜별 목록으로 바뀐다. */
:root {
  --bg: #f3f1ec;
  --surface: #ffffff;
  --ink: #1d1f26;
  --muted: #6d717c;
  --line: #dedbd2;
  --hair: #ebe9e2;
  --head: #e8e5dd;
  --hover: #f1effa;
  --accent: #5a54d6;
  --accent-ink: #ffffff;
  --tint: #ebeafc;
  --sun: #d8344a;
  --sat: #3a62d4;
  --t-new: #e0364c;
  --on-new: #ffffff;
  --t-rev: #2b2e38;
  --t-rep: #178052;
  --t-etc: #6d717c;
  --ok: #178052;
  --warn: #9a6200;
  --err: #d8344a;
  --today: #5a54d6;
  --ds: 62%;
  --dl: 34%;
  --tbl: 94.5%;
  --sh: 0 1px 2px rgba(40, 36, 20, 0.05), 0 8px 20px -12px rgba(40, 36, 20, 0.22);
  --font: "IBM Plex Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121418;
    --surface: #1b1e25;
    --ink: #eceef2;
    --muted: #9ba1ac;
    --line: #353a45;
    --hair: #2a2f38;
    --head: #262a32;
    --hover: #242a3d;
    --accent: #9a96ff;
    --accent-ink: #12122a;
    --tint: #2a2c4d;
    --sun: #ff7a8c;
    --sat: #86a7ff;
    --t-new: #ff7a8c;
    --on-new: #2b0d12;
    --t-rev: #eceef2;
    --t-rep: #5fd49a;
    --t-etc: #9ba1ac;
    --ok: #5fd49a;
    --warn: #f0b95a;
    --err: #ff7a8c;
    --today: #9a96ff;
    --dl: 74%;
    --tbl: 24%;
    --sh: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 20px -12px rgba(0, 0, 0, 0.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121418;
  --surface: #1b1e25;
  --ink: #eceef2;
  --muted: #9ba1ac;
  --line: #353a45;
  --hair: #2a2f38;
  --head: #262a32;
  --hover: #242a3d;
  --accent: #9a96ff;
  --accent-ink: #12122a;
  --tint: #2a2c4d;
  --sun: #ff7a8c;
  --sat: #86a7ff;
  --t-new: #ff7a8c;
  --on-new: #2b0d12;
  --t-rev: #eceef2;
  --t-rep: #5fd49a;
  --t-etc: #9ba1ac;
  --ok: #5fd49a;
  --warn: #f0b95a;
  --err: #ff7a8c;
  --today: #9a96ff;
  --dl: 74%;
  --tbl: 24%;
  --sh: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 20px -12px rgba(0, 0, 0, 0.6);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
[hidden] { display: none !important; }
.stat-wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 48px;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: min(1560px, 96vw); margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

/* 상단 */
.top { position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; padding: 26px 16px 22px; border-radius: 22px; background: var(--surface); border: 1px solid var(--hair); box-shadow: var(--sh); isolation: isolate; }
.top .art { position: absolute; inset: 0; z-index: -2; opacity: .6; }
.top .art svg { width: 100%; height: 100%; display: block; }
.top::after { content: ""; position: absolute; inset: 0; z-index: -1; background: radial-gradient(ellipse 42% 78% at 50% 50%, color-mix(in srgb, var(--surface) 82%, transparent), transparent 100%); }
@media (prefers-color-scheme: dark) { .top .art { opacity: .3; } }
.hero-link { position: absolute; top: 14px; right: 14px; z-index: 1; padding: 6px 14px; border-radius: 999px; background: color-mix(in srgb, var(--surface) 92%, transparent); border: 1px solid var(--hair); color: var(--ink); font-weight: 600; font-size: 13px; text-decoration: none; box-shadow: var(--sh); white-space: nowrap; }
.hero-link:hover { background: var(--surface); color: var(--accent); }
@media (max-width: 760px) { .hero-link { position: static; order: -1; align-self: flex-end; } }
@media print { .hero-link { display: none; } }
@media print { .top { background: none; border: 0; box-shadow: none; } .top .art, .top::after { display: none; } }
h1 { margin: 0; font-size: clamp(24px, 4.6vw, 34px); font-weight: 700; letter-spacing: -0.02em; text-wrap: balance; }
.sub { display: inline-block; padding: 3px 16px; border-radius: 999px; background: var(--surface); border: 1px solid var(--hair); box-shadow: var(--sh); font-size: clamp(13px, 2.4vw, 15px); font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; justify-content: space-between; }
.tabs { display: inline-flex; gap: 2px; padding: 3px; background: var(--head); border-radius: 999px; }
.tabs button { border: 0; background: transparent; padding: 6px 18px; border-radius: 999px; font-weight: 500; color: var(--muted); transition: background 0.15s, color 0.15s; }
.tabs button:hover { color: var(--ink); }
.tabs button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 700; box-shadow: var(--sh); }
.status { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--muted); }
.status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.status.ok::before { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 22%, transparent); }
.status.warn::before { background: var(--warn); }
.status.err::before { background: var(--err); }
.nav { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.yr { display: inline-flex; align-items: center; border: 1px solid var(--hair); border-radius: 999px; background: var(--surface); box-shadow: var(--sh); }
.yr button { border: 0; background: none; padding: 5px 12px; font-size: 13px; color: var(--muted); border-radius: 999px; }
.yr button:hover { color: var(--ink); }
.yr output { min-width: 4.2em; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
.months { display: flex; flex-wrap: wrap; gap: 4px; }
.months button { min-width: 2.8em; padding: 5px 10px; border: 1px solid var(--hair); border-radius: 999px; background: var(--surface); font-variant-numeric: tabular-nums; color: var(--muted); }
.months button:hover { background: var(--hover); color: var(--ink); }
.months button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
.ghost { border: 1px solid var(--hair); background: var(--surface); border-radius: 999px; padding: 5px 14px; box-shadow: var(--sh); }
.ghost:hover { background: var(--hover); }

/* 범례/요약 */
.meta { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
.sum { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.sum b { color: var(--ink); font-weight: 700; }
.legend { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
#legend, #legendDes { flex: 1 1 100%; }
.fbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; margin: 4px 0 10px; }
.fbar label { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: var(--muted); }
.fbar select { padding: 6px 28px 6px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--ink); font-weight: 500; min-width: 150px; }
.fbar select.on { border-color: var(--accent); background: var(--tint); font-weight: 700; }
.fbar[hidden] { display: none; }
.lgl { font-size: 12px; font-weight: 700; color: var(--muted); margin-right: 2px; }
.lgl.sp { margin-left: 10px; }
.chip.dept { font-weight: 700; background: var(--bg); }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 11px 3px 9px; border-radius: 999px; border: 1px solid var(--hair); background: var(--surface); font-size: 12.5px; }
.chip:hover { background: var(--hover); }
.chip[aria-pressed="true"] { border-color: hsl(var(--h, 235) var(--ds) 52%); background: hsl(var(--h, 235) calc(var(--ds) * 0.6) var(--tbl)); font-weight: 600; }
.chip i { width: 10px; height: 10px; border-radius: 50%; background: hsl(var(--h) var(--ds) 52%); display: inline-block; }
.chip em { font-style: normal; color: var(--muted); font-variant-numeric: tabular-nums; }

/* 달력 */
.scroll { overflow-x: auto; padding: 4px 2px 6px; margin: 0 -2px; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
.cal .dow { text-align: center; font-weight: 700; font-size: 12px; letter-spacing: 0.08em; color: var(--muted); padding: 2px 0 0; }
.dow.sun, .dn.sun { color: var(--sun); }
.dow.sat, .dn.sat { color: var(--sat); }
.day { position: relative; min-height: 8.4rem; padding: 8px 8px 8px; background: var(--surface); border: 1px solid var(--hair); border-radius: 14px; box-shadow: var(--sh); display: flex; flex-direction: column; gap: 6px; min-width: 0; cursor: cell; transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s; }
.day:hover { transform: translateY(-1px); border-color: var(--line); }
.day.blank { background: transparent; border-color: transparent; box-shadow: none; cursor: default; }
.day.blank:hover { transform: none; }
.day.today { border-color: var(--today); box-shadow: 0 0 0 2px color-mix(in srgb, var(--today) 28%, transparent), var(--sh); }
.dn { display: flex; align-items: center; gap: 6px; font-weight: 700; font-variant-numeric: tabular-nums; min-height: 1.8rem; }
.dn .num { display: inline-grid; place-items: center; min-width: 1.8em; height: 1.8em; padding: 0 4px; border-radius: 999px; font-size: 14px; line-height: 1; }
.day.today .dn .num { background: var(--today); color: var(--accent-ink); }
.dn .wd { display: none; font-size: 11.5px; font-weight: 600; color: var(--muted); }
.dn.sun .wd { color: var(--sun); }
.dn.sat .wd { color: var(--sat); }
.dn .hl { font-size: 10.5px; font-weight: 600; padding: 0 7px; border-radius: 999px; color: var(--sun); background: color-mix(in srgb, var(--sun) 11%, transparent); line-height: 1.7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.dn .add { margin-left: auto; width: 24px; height: 24px; border: 0; border-radius: 50%; background: var(--hover); color: var(--accent); padding: 0; font-size: 15px; line-height: 1; opacity: 0; transition: opacity 0.12s; flex: none; }
.day:hover .add, .add:focus-visible { opacity: 1; }
@media (hover: none) { .dn .add { opacity: 0.75; } }
.list { padding: 0; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.ent { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 1px 4px; border-radius: 5px; font-size: 12.5px; line-height: 1.45; overflow-wrap: anywhere; transition: background 0.12s; }
.ent:hover { background: var(--hover); }
.ent.dim { opacity: 0.25; }
.ty { font-weight: 600; }
.t-new { color: var(--t-new); }
.t-rev { color: var(--t-rev); }
.t-rep { color: var(--t-rep); }
.t-etc { color: var(--t-etc); }
.t-cov { color: var(--accent); }
.dz { font-weight: 700; font-size: 12px; color: hsl(var(--h) var(--ds) var(--dl)); white-space: nowrap; }
.dz.none { color: var(--muted); font-weight: 400; }
.dz.dot { display: inline-flex; align-items: center; justify-content: center; min-width: 25px; height: 25px; padding: 0 3px; box-sizing: border-box; border-radius: 50%; font-size: 10.5px; letter-spacing: -.3px; line-height: 1; background: hsl(var(--h) var(--ds) 50% / .13); border: 1.5px solid hsl(var(--h) var(--ds) var(--dl)); }
.dz.dot.none { background: transparent; border: 1.5px dashed var(--hair); font-weight: 400; }
.hs { display: block; font-size: 11.5px; color: var(--muted); margin-top: 1px; }

/* 비고 */
.note { display: flex; border: 1px solid var(--hair); border-radius: 14px; background: var(--surface); box-shadow: var(--sh); overflow: hidden; }
.note label { flex: none; width: 4.8rem; display: flex; align-items: center; justify-content: center; font-weight: 700; letter-spacing: 0.3em; color: var(--muted); background: var(--head); }
.note .nb { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.note .nt { flex: 1; min-width: 0; width: 100%; border: 0; background: transparent; padding: 10px 14px; min-height: 4.6rem; line-height: 1.65; outline: none; white-space: pre-wrap; overflow-wrap: anywhere; cursor: text; }
.note .nt:empty::before { content: attr(data-ph); color: var(--muted); pointer-events: none; }
.note .nt:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 0 0 14px 0; }
.nfmt { display: flex; align-items: center; gap: 6px; padding: 6px 10px 0 12px; }
.nfmt[hidden] { display: none; }
.nfmt button { font: inherit; cursor: pointer; border: 1px solid var(--hair); background: var(--surface); color: var(--ink); border-radius: 8px; height: 26px; min-width: 26px; padding: 0 8px; font-size: 12.5px; }
.nfmt button.b { font-weight: 800; }
.nfmt button.c { width: 22px; min-width: 22px; height: 22px; padding: 0; border-radius: 50%; border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--hair); }
.nfmt .sp { width: 1px; height: 16px; background: var(--hair); margin: 0 2px; }
.cal.joined { margin-bottom: 12px; }

.empty { color: var(--muted); font-size: 13px; padding: 2px 0; }

/* 연간 */
.year { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
.mini { background: var(--surface); border: 1px solid var(--hair); border-radius: 16px; box-shadow: var(--sh); padding: 12px 14px 14px; text-align: left; }
.mini h3 { margin: 0 0 6px; display: flex; justify-content: space-between; align-items: baseline; font-size: 14px; }
.mini h3 button { border: 0; background: none; font-weight: 700; font-size: 16px; padding: 0; }
.mini h3 button:hover { color: var(--accent); }
.mini h3 span { font-size: 12px; color: var(--muted); font-weight: 600; }
.mg { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; font-size: 11.5px; font-variant-numeric: tabular-nums; }
.mg .h { color: var(--muted); font-size: 10.5px; padding-bottom: 2px; }
.mg .c { border: 0; background: none; padding: 3px 0; border-radius: 8px; color: var(--ink); }
.mg .c:hover:not(:disabled) { background: var(--hover); }
.mg .c.sun { color: var(--sun); }
.mg .c.sat { color: var(--sat); }
.mg .c.has { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.mg .c.has.hasnew { background: var(--t-new); color: var(--on-new); }
.mg .c.today { outline: 2px solid var(--ink); outline-offset: -2px; }
.mg .c:disabled { visibility: hidden; }
.tbl { overflow-x: auto; background: var(--surface); border: 1px solid var(--hair); border-radius: 16px; box-shadow: var(--sh); }
.tbl table { border-collapse: collapse; width: 100%; min-width: 720px; font-variant-numeric: tabular-nums; }
.tbl th, .tbl td { padding: 7px 8px; text-align: center; border-bottom: 1px solid var(--hair); }
.tbl th { background: var(--head); font-weight: 700; font-size: 12.5px; }
.tbl td:first-child, .tbl th:first-child { text-align: left; padding-left: 14px; }
.tbl td.z { color: var(--line); }
.tbl tr:last-child td { border-bottom: 0; font-weight: 700; background: color-mix(in srgb, var(--head) 55%, transparent); }
.tbl td:last-child, .tbl th:last-child { border-left: 1px solid var(--hair); font-weight: 700; }
h2.sec { margin: 6px 0 -4px; font-size: 16px; }

/* 도서 이력 */
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.tools input[type="search"] { flex: 1 1 220px; min-width: 0; padding: 8px 16px; border: 1px solid var(--hair); border-radius: 999px; background: var(--surface); box-shadow: var(--sh); }
.books { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; align-items: start; }
.book { background: var(--surface); border: 1px solid var(--hair); border-radius: 16px; box-shadow: var(--sh); padding: 12px 14px; min-width: 0; }
.book h3 { margin: 0 0 6px; font-size: 15px; overflow-wrap: anywhere; }
.rows { display: flex; flex-direction: column; }
.row { display: grid; grid-template-columns: 6.6rem 4.4rem minmax(0, 1fr); gap: 6px; align-items: baseline; text-align: left; border: 0; border-top: 1px solid var(--hair); background: none; padding: 6px 4px; font-size: 13px; border-radius: 8px; }
.row:hover { background: var(--hover); }
.row .d { font-variant-numeric: tabular-nums; color: var(--muted); }
.row .m { overflow-wrap: anywhere; }
.row .m small { display: block; color: var(--muted); font-size: 12px; }

/* 하루 여러 권 */
.cal.compact .ent { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cal.compact .hs { display: none; }
.cal.compact .day { min-height: 6.4rem; }
.more { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 1px 6px; font-size: 12px; font-weight: 700; color: var(--accent); border-radius: 6px; }
.more:hover { background: var(--hover); }
.mtools { margin-left: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.tog { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; }
.mtools [hidden] { display: none; }

/* 입력 창 */
.modal { position: fixed; inset: 0; background: rgba(14, 14, 24, 0.5); backdrop-filter: blur(3px); display: flex; align-items: center; justify-content: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); z-index: 20; }
.modal[hidden], .toast[hidden] { display: none; }
.sheet { background: var(--surface); border: 1px solid var(--hair); border-radius: 20px; box-shadow: 0 24px 60px -20px rgba(0, 0, 0, 0.45); width: 100%; max-width: 480px; max-height: 100%; overflow-y: auto; padding: 20px 22px 18px; display: flex; flex-direction: column; gap: 14px; }
.sheet h2 { margin: 0; font-size: 18px; }
.f { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.f > span, .f > legend { font-size: 12.5px; font-weight: 600; color: var(--muted); padding: 0; }
fieldset.f { border: 0; margin: 0; padding: 0; }
.f input[type="text"], .f input[type="date"], .f input[type="password"], .f select { width: 100%; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); min-width: 0; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg label { position: relative; }
.seg input { position: absolute; opacity: 0; inset: 0; }
.seg span { display: inline-block; padding: 5px 14px; border: 1px solid var(--line); border-radius: 999px; background: var(--bg); }
.seg input:checked + span { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.seg input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.acts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 2px; }
.acts .sp { flex: 1; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 20px; }
.btn.okstamp, .btn.okstamp:hover { background: #e03131; border-color: #e03131; color: #fff; font-weight: 700; }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
.btn.del { color: var(--err); border-color: var(--err); }
.btn.del.arm { background: var(--err); color: var(--bg); }
.hint { margin: -4px 0 0; font-size: 12.5px; color: var(--muted); }
.hint[hidden] { display: none; }
.err { color: var(--err); font-size: 13px; min-height: 1.3em; margin: 0; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(18px, env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 9px 18px; border-radius: 999px; z-index: 30; max-width: calc(100% - 32px); box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5); }

/* 좁은 화면: 주간 격자 → 날짜별 목록 */
@media (max-width: 760px) {
  body { padding-block: 16px 40px; }
  .tabs button { padding: 6px 13px; }
  .scroll { overflow: visible; padding: 0; margin: 0; }
  .cal { display: flex; flex-direction: column; gap: 8px; }
  .cal .dow, .day.blank { display: none; }
  .day { min-height: 0; flex-direction: row; align-items: flex-start; gap: 12px; padding: 10px 12px; cursor: pointer; }
  .day:hover { transform: none; }
  .dn { flex: none; width: 3.6rem; flex-direction: column; align-items: flex-start; gap: 3px; min-height: 0; }
  .dn .wd { display: block; }
  .dn .hl { max-width: 100%; }
  .dn .add { position: absolute; top: 10px; right: 10px; margin: 0; opacity: 0.8; }
  .list { flex: 1; padding-right: 26px; }
  .ent { font-size: 13.5px; padding: 3px 5px; }
  .day.idle { padding: 6px 12px; align-items: center; box-shadow: none; background: transparent; border-style: dashed; }
  .day.idle .dn { flex-direction: row; align-items: center; gap: 8px; width: auto; }
  .day.idle .list { display: none; }
  .day.idle .dn .add { top: 50%; transform: translateY(-50%); }
  .note { flex-direction: column; }
  .note label { width: auto; padding: 7px 12px; justify-content: flex-start; letter-spacing: 0.15em; }
  .note .nt:focus-visible { border-radius: 0 0 14px 14px; }
  .mtools { margin-left: 0; }
  .row { grid-template-columns: 5.6rem 4.6rem minmax(0, 1fr); }
  .tog { display: none; }
}
@media (min-width: 761px) {
  .cal { gap: 10px; }
  .cal .dow { font-size: 14px; padding: 4px 0 2px; }
  .day { min-height: 10.5rem; padding: 9px 9px 10px; gap: 7px; border-radius: 15px; }
  .cal.compact .day { min-height: 7.5rem; }
  .cal.wk-slim { grid-template-columns: minmax(0, .42fr) repeat(5, minmax(0, 1fr)) minmax(0, .42fr); }
  .cal.wk-slim .day:nth-child(7n+1), .cal.wk-slim .day:nth-child(7n) { padding: 8px 6px; }
  .cal.wk-slim .dn .wd, .cal.wk-slim .dn .add { display: none; }
  .cal.wk-slim .dn .hl { display: none; }
  .dn .num { font-size: 15px; }
  .dn .hl { font-size: 11.5px; }
  .ent { font-size: 13.5px; line-height: 1.5; padding: 3px 5px; }
  .dz.dot { min-width: 26px; height: 26px; font-size: 11px; }
  .more { font-size: 13px; }
}

<body>
<div class="wrap">
  <header class="top">
    <div class="art" id="art" aria-hidden="true"></div>
    <a class="hero-link" href="https://3rdsch.vercel.app/#list" target="_blank" rel="noopener noreferrer">주간계획서 바로가기 <span aria-hidden="true">↗</span></a>
    <h1>도서출판본부 월간계획표</h1>
    <div class="sub" id="sub"></div>
  </header>

  <div class="bar">
    <div class="tabs" role="group" aria-label="보기 전환">
      <button type="button" id="tabMonth" aria-pressed="true">월간</button>
      <button type="button" id="tabYear" aria-pressed="false">연간</button>
      <button type="button" id="tabBooks" aria-pressed="false">도서 이력</button>
    </div>
    <div class="stat-wrap"><div class="status" id="status" role="status">연결 중…</div><button type="button" class="ghost" id="btnLock">수정하려면 비밀번호 입력</button></div>
  </div>

  <div class="nav" id="nav">
    <div class="yr"><button type="button" id="yPrev" aria-label="이전 해">◀</button><output id="yOut"></output><button type="button" id="yNext" aria-label="다음 해">▶</button></div>
    <div class="months" id="months" role="group" aria-label="월 선택"></div>
    <button type="button" class="ghost" id="goToday">오늘</button>
  </div>

  <div class="fbar" id="fbar">
    <label>담당자 <select id="mgrFilter"></select></label>
    <label>조판자 <select id="desFilter"></select></label>
    <button type="button" class="ghost" id="fClear" hidden>필터 해제</button>
  </div>
  <section id="vMonth">
    <div class="meta">
      <div class="sum" id="sum"></div>
      <div class="mtools">
        <label class="tog" for="cmp"><input type="checkbox" id="cmp"> 한 줄로 보기</label>
        <button type="button" class="ghost" id="btnPrintOrders">발주도서 인쇄</button>
        <button type="button" class="ghost" id="btnPrint">인쇄</button>
      </div>
    </div>
    <div class="scroll" style="margin-top:10px">
      <div id="cal" class="cal joined"></div>
      <div class="note">
        <label for="noteEl">비 고</label>
        <div class="nb">
          <div class="nfmt" id="noteFmt" hidden>
            <button type="button" class="b" data-cmd="bold" title="선택한 글자를 굵게">B</button>
            <span class="sp"></span>
            <button type="button" class="c" data-color="#d62828" style="background:#d62828" title="빨강" aria-label="빨강"></button>
            <button type="button" class="c" data-color="#1d4ed8" style="background:#1d4ed8" title="파랑" aria-label="파랑"></button>
            <button type="button" class="c" data-color="#15803d" style="background:#15803d" title="초록" aria-label="초록"></button>
            <button type="button" class="c" data-color="#c2610c" style="background:#c2610c" title="주황" aria-label="주황"></button>

        </div>
      </div>

    </div>
    <div class="books" id="bookList" style="margin-top:12px"></div>

<div class="modal" id="ed" hidden>

      </div>
      <div class="bk-row">
        <label class="f"><span>판형</span><input type="text" id="bkFmt" list="bkFmtList" placeholder="선택하거나 직접 입력"></label>
        <label class="f"><span>제작방식</span><input type="text" id="bkMethod" list="bkMethodList" placeholder="선택하거나 직접 입력"></label>

        <label class="f"><span>이전판 제작부수</span><span class="sfx"><input type="number" id="bkPrevRun" min="0"><b>부</b></span></label>

        <span>인지 현황</span>

    bindAutoList($('bkHistory'), /^(\s*)(\d+)차\)\s?/, function (m) { return m[1] + (Number(m[2]) + 1) + '차) '; }, '');
    $('bkNoStamp').addEventListener('change', syncStamp);
    $('bkCompAdd').addEventListener('click', function () { $('bkComps').appendChild(compRow({})); });
    $('cfForm').addEventListener('submit', submitCf);
    $('cfCancel').addEventListener('click', closeCf);
    $('cf').addEventListener('mousedown', function (e) { if (e.target === $('cf')) closeCf(); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('cf').hidden) closeCf(); });
    $('edCancel').addEventListener('click', closeEditor);
    $('edDel').addEventListener('click', deleteEditor);
    $('ed').addEventListener('mousedown', function (e) { if (e.target === $('ed')) closeEditor(); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('ed').hidden) closeEditor(); });
    window.addEventListener('hashchange', function () { fromHash(); render(); });
    window.addEventListener('pagehide', flushNote);
  }

  /* ---------- 인쇄용 파일 ---------- */
  var PRINT_CSS = '@page{size:A4 landscape;margin:10mm}*{box-sizing:border-box}body{font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#000;margin:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}h1{text-align:center;font-size:20pt;margin:0 0 4mm}table{width:100%;border-collapse:collapse;table-layout:fixed;border:1.5pt solid #000}th{background:#e6e6e6;border:.5pt solid #000;font-size:10pt;padding:1mm}td{border:.5pt solid #000;vertical-align:top;padding:0}.n{border-bottom:.5pt dotted #000;padding:.5mm 1.5mm;font-size:9pt;font-weight:700}.hl{font-size:8pt;font-weight:500}.e{padding:.4mm 1.5mm;font-size:8.5pt;line-height:1.35;overflow-wrap:anywhere}.sun{color:#d00}.sat{color:#00c}.ty{font-weight:700}.ty.new{color:#d00}.ty.cov{color:#06c}.ty.rep{color:#080}.ty.etc{color:#555}.mu{color:#666}.note{display:flex;border:1.5pt solid #000;border-top:0}.nl{width:16mm;flex:none;background:#e6e6e6;border-right:.5pt solid #000;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:9pt}.nt{padding:1.5mm 2mm;font-size:8.5pt;line-height:1.5;white-space:pre-wrap;flex:1}.bar{position:fixed;top:6px;right:6px}@media print{.bar{display:none}}';
  var P_TYPE = { '신간': ['新', 'new'], '개정': ['개정', ''], '개정2판': ['개정2판', ''], '표지갈이': ['표지갈이', 'cov'], '재쇄': ['재쇄', 'rep'], '기타': ['기타', 'etc'] };
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function printTag(e) {
    var mg = mgrOf(e.id);
    if (mg) return '<b style="color:hsl(' + mHue(mg) + ' 65% 32%)">[' + esc(mg.slice(1)) + ']</b>';
    return '<span class="mu">[미정]</span>';
  }
  function buildPrintHtml(y, m) {
    var first = new Date(y, m - 1, 1).getDay();
    var days = new Date(y, m, 0).getDate();
    var rows = Math.ceil((first + days) / 7);
    var rowH = rows > 5 ? 24 : 29;
    var out = [];
    out.push('<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>도서출판본부 월간계획표 ' + y + '-' + pad(m) + '</title><style>' + PRINT_CSS + '</style></head><body>');
    out.push('<h1>도서출판본부 월간계획표 (' + y + '年 ' + pad(m) + '月)</h1><table><thead><tr>');
    DOW.forEach(function (n, i) { out.push('<th class="' + (i === 0 ? 'sun' : i === 6 ? 'sat' : '') + '">' + n + '</th>'); });
    out.push('</tr></thead><tbody>');
    for (var r = 0; r < rows; r++) {
      out.push('<tr style="height:' + rowH + 'mm">');
      for (var c = 0; c < 7; c++) {
        var d = r * 7 + c - first + 1;
        if (d < 1 || d > days) { out.push('<td></td>'); continue; }
        var key = ymKey(y, m) + '-' + pad(d);
        var hol = holiday(y, m, d);
        var cls = (c === 0 || hol) ? 'sun' : c === 6 ? 'sat' : '';
        out.push('<td><div class="n ' + cls + '">' + d + (hol ? ' <span class="hl">' + esc(hol) + '</span>' : '') + '</div>');
        (byDate.get(key) || []).forEach(function (e) {
          var t = P_TYPE[e.type] || P_TYPE['기타'];
          out.push('<div class="e"><span class="ty ' + t[1] + '">[' + t[0] + ']</span> ' + esc(e.title) + ' ' + printTag(e) + (e.history ? ' <span class="mu">(' + esc(e.history) + ')</span>' : '') + '</div>');
        });
        out.push('</td>');
      }
      out.push('</tr>');
    }
    out.push('</tbody></table>');
    out.push('<div class="note"><div class="nl">비 고</div><div class="nt">' + noteToHtml(notes.get(ymKey(y, m)) || '') + '</div></div>');
    out.push('</body></html>');
    return out.join('');
  }
  var ORDER_CSS = '@page{size:A4;margin:12mm}*{box-sizing:border-box}body{font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#000;margin:0;font-size:11pt;-webkit-print-color-adjust:exact;print-color-adjust:exact}.b{break-inside:avoid;page-break-inside:avoid;border:1pt solid #000;padding:4mm 5mm;margin:0 0 5mm}h1{font-size:15pt;margin:0 0 3mm;text-align:center}h2{font-size:14pt;margin:0 0 1mm}.sub{font-size:9.5pt;color:#444;margin-bottom:3mm}.k{display:flex;border:.5pt solid #000;margin-bottom:3mm}.k>div{flex:1;padding:1.5mm 3mm;border-left:.5pt solid #000}.k>div:first-child{border-left:0}.l{font-size:8.5pt;color:#555}.v{font-size:12pt;font-weight:700}table{width:100%;border-collapse:collapse;margin-bottom:3mm}td{border:.5pt solid #000;padding:1.5mm 3mm;width:25%;vertical-align:top}.t{font-size:10pt;font-weight:700;margin:2mm 0 1mm}.tx{white-space:pre-wrap;font-size:10.5pt;line-height:1.5}.c{font-size:10pt;margin:0 0 1mm}.f{font-size:8.5pt;color:#555;margin-top:2mm}';
  function orderBlockHtml(id) {
    var e = entries.get(id); if (!e) return '';
    var d = orderOf(id) || {};
    var n = function (v, suf) { return v ? Number(v).toLocaleString() + suf : '-'; };
    var t = function (v) { return v ? esc(v) : '-'; };
    var o = '<div class="b"><h2>[' + esc(e.type || '') + '] ' + esc(e.title) + '</h2>' + (d.author ? '<div class="sub" style="font-size:11pt;color:#000;font-weight:700">저자 ' + esc(d.author) + '</div>' : '') + '<div class="sub">' + esc('표지 : ' + (d.coverDesigner || '미정') + ' · 내지 : ' + (e.designer ? (e.designer === '외주' && e.ext ? '외주 ' + e.ext : e.designer) : '미정')) + (e.history ? ' · ' + esc(e.history) : '') + '</div>';
    o += '<div class="k"><div><div class="l">담당자</div><div class="v">' + t(d.manager) + '</div></div><div><div class="l">출간일</div><div class="v">' + esc(fmtDot(e.date)) + '</div></div><div><div class="l">발행일</div><div class="v">' + (d.publishDate ? esc(fmtDot(d.publishDate)) : '-') + '</div></div></div>';
    o += '<table><tr><td><div class="l">판형</div><b>' + t(d.bookFormat) + '</b></td><td><div class="l">제작방식</div><b>' + t(d.productionMethod) + '</b></td><td><div class="l">제작부수</div><b>' + n(d.printRun, '부') + (d.prevRun ? ' (이전판 ' + Number(d.prevRun).toLocaleString() + '부)' : '') + '</b></td><td><div class="l">판/쇄</div><b>' + t(d.edition) + '</b></td></tr>' +
      '<tr><td><div class="l">페이지</div><b>' + n(d.pageCount, 'p') + deltaPrint(d.pageDelta, 'p') + '</b></td><td><div class="l">작업툴</div><b>' + t(d.workTool) + '</b></td><td><div class="l">정가</div><b>' + n(d.listPrice, '원') + deltaPrint(d.priceDelta, '원') + '</b></td><td><div class="l">지류</div><b>' + t(d.paperType) + '</b></td></tr></table>';
    if (d.details) o += '<div class="t">도서 상세 내용</div><div class="tx">' + esc(d.details) + '</div>';
    if (d.printHistory) o += '<div class="t">인쇄부수 이력</div><div class="tx" style="font-size:10pt">' + esc(d.printHistory) + '</div>';
    if (d.noStamp) o += '<div class="t">인지 현황 <span style="font-weight:700">[무인지 도서]</span></div>';
    else if (d.stampHave != null || d.stampNeed != null) o += '<div class="t">인지 현황</div><div class="tx">인지 현황 : ' + (d.stampHave != null ? Number(d.stampHave).toLocaleString() + '매' : '-') + ' &nbsp;·&nbsp; 받을 인지 : ' + (d.stampNeed != null ? Number(d.stampNeed).toLocaleString() + '매' : '-') + '</div>';
    if ((d.competitors || []).length) {
      o += '<div class="t">경쟁사</div>';
      d.competitors.forEach(function (c) {
        var meta = [];
        if (c.price) meta.push('정가 ' + Number(c.price).toLocaleString() + '원');
        if (c.pages) meta.push(Number(c.pages).toLocaleString() + 'p');
        if (c.pubDate) meta.push('발행 ' + fmtDot(c.pubDate));
        o += '<div class="c"><b>' + esc(c.name) + '</b>' + (meta.length ? ' — ' + esc(meta.join(' · ')) : '') + '</div>';
      });
    }
    if (d.confirmed) o += '<div class="f" style="color:#e0364c;font-weight:700">✔ 상무님 확인 완료' + (d.confirmedAt ? ' · ' + esc(String(d.confirmedAt).slice(0, 10).replace(/-/g, '.')) : '') + '</div>';
    if ((d.attachments || []).length) o += '<div class="f">첨부: ' + d.attachments.map(function (a) { return esc(a.name); }).join(', ') + '</div>';
    return o + '</div>';
  }
  function printDoc(title, body) {
    var f = document.createElement('iframe');
    f.setAttribute('aria-hidden', 'true');
    f.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0';
    document.body.appendChild(f);
    var d = f.contentWindow.document;
    d.open();
    d.write('<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>' + esc(title) + '</title><style>' + ORDER_CSS + '</style></head><body>' + body + '</body></html>');
    d.close();
    setTimeout(function () {
      try { f.contentWindow.focus(); f.contentWindow.print(); } catch (e) { toast('인쇄 창을 열지 못했습니다.'); }
      setTimeout(function () { if (f.parentNode) f.parentNode.removeChild(f); }, 3000);
    }, 400);
  }
  function printOrders() {
    var list = monthEntries(view.y, view.m).filter(function (e) { return orders.has(e.id) && mgrMatch(e.id); });
    if (!list.length) { toast('이 달에 인쇄할 발주도서 정보가 없습니다.'); return; }
    list.sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
    var title = view.y + '년 ' + view.m + '월 발주도서' + (filterMgr ? ' (' + (filterMgr === '__none' ? '담당 미정' : filterMgr.indexOf('dept:') === 0 ? filterMgr.slice(5) : filterMgr) + ')' : '');
    printDoc(title, '<h1>' + esc(title) + '</h1>' + list.map(function (e) { return orderBlockHtml(e.id); }).join(''));
  }
  function printMonth() {
    flushNote();
    var f = document.createElement('iframe');
    f.setAttribute('aria-hidden', 'true');
    f.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0';
    document.body.appendChild(f);
    var d = f.contentWindow.document;
    d.open();
    d.write(buildPrintHtml(view.y, view.m));
    d.close();
    setTimeout(function () {
      try { f.contentWindow.focus(); f.contentWindow.print(); } catch (e) { toast('인쇄 창을 열지 못했습니다.'); }
      setTimeout(function () { if (f.parentNode) f.parentNode.removeChild(f); }, 3000);
    }, 400);
  }

  /* ---------- 시작 ---------- */
  var sb = null;
  var passcode = '';
  var live = false;
  var refreshTimer = null;
  function rpc(name, args) {
    return sb.rpc(name, args).then(function (r) {
      if (r.error) throw r.error;
      return r.data;
    });
  }
  function scheduleRefresh() { clearTimeout(refreshTimer); refreshTimer = setTimeout(refresh, 250); }
  function refresh() {
    return Promise.all([
      sb.from('schedule_entries').select('*'),
      sb.from('schedule_notes').select('*'),
      sb.from('book_orders').select('*').order('id', { ascending: false }).limit(5000).then(function (x) { return x; }, function () { return { data: [] }; })
    ]).then(function (r) {
      if (r[0].error || r[1].error) throw (r[0].error || r[1].error);
      entries = new Map();
      r[0].data.forEach(function (x) {
        entries.set(x.id, { date: x.date, type: x.type, title: x.title, history: x.history || '', designer: x.designer || '', tagRaw: x.tag_raw || '', ext: x.ext || '', at: Number(x.at) || 0 });
      });
      orders = new Map();
      ((r[2] && r[2].data) || []).forEach(function (x) {
        var d = x.data || {};
        if (d.entryId && !d.archived && !orders.has(d.entryId)) orders.set(d.entryId, { id: x.id, data: d, updated: x.updated_at });
      });
      notes = new Map();
      r[1].data.forEach(function (x) { notes.set(x.ym, x.body || ''); });
      rebuild();
      render();
      if (!live) setStatus('ok', '연결됨');
    }, function () {
      setStatus('err', '불러오지 못했습니다. 30초 뒤 다시 시도합니다.');
    });
  }
  function updateLock() {
    $('btnLock').textContent = canWrite ? '수정 가능 · 잠그기' : '수정하려면 비밀번호 입력';
  }
  function openPw() {
    $('pwErr').textContent = '';
    $('pwIn').value = '';
    $('pw').hidden = false;
    $('pwIn').focus();
  }
  function closePw() { $('pw').hidden = true; }
  function submitPw(ev) {
    ev.preventDefault();
    var v = $('pwIn').value;
    if (!v || !sb) return;
    sb.rpc('schedule_check', { p: v }).then(function (r) {
      if (r.error || r.data !== true) { $('pwErr').textContent = '비밀번호가 맞지 않습니다.'; return; }
      passcode = v;
      canWrite = true;
      try { localStorage.setItem('sched.pass', v); } catch (e) { /* 무시 */ }
      closePw();
      updateLock();
      renderNote();
      toast('수정할 수 있습니다.');
    }, function () { $('pwErr').textContent = '확인하지 못했습니다. 잠시 뒤 다시 시도하세요.'; });
  }
  function wirePw() {
    $('pwForm').addEventListener('submit', submitPw);
    $('pwCancel').addEventListener('click', closePw);
    $('pw').addEventListener('mousedown', function (e) { if (e.target === $('pw')) closePw(); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('pw').hidden) closePw(); });
    $('btnLock').addEventListener('click', function () {
      if (canWrite) {
        flushNote();
        canWrite = false;
        passcode = '';
        try { localStorage.removeItem('sched.pass'); } catch (e) { /* 무시 */ }
        updateLock();
        renderNote();
        toast('잠갔습니다.');
      } else {
        openPw();
      }
    });
    $('noteEl').addEventListener('click', function () { if (!canWrite) openPw(); });
  }
  function start() {
    wirePw();
    if (!window.supabase || !window.supabase.createClient) { setStatus('err', '저장소 라이브러리를 불러오지 못했습니다.'); return; }
    sb = window.supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: false, autoRefreshToken: false } });
    try { passcode = localStorage.getItem('sched.pass') || ''; } catch (e) { passcode = ''; }
    updateLock();
    refresh();
    setInterval(function () { if (!document.hidden) refresh(); }, 30000);
    sb.channel('schedule-live')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'schedule_entries' }, scheduleRefresh)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'schedule_notes' }, scheduleRefresh)
      .subscribe(function (status) {
        live = status === 'SUBSCRIBED';
        if (live) setStatus('ok', '실시간 연결됨');
        else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') setStatus('warn', '실시간 연결이 끊겼습니다. 30초마다 새로고침합니다.');
      });
    if (passcode) {
      sb.rpc('schedule_check', { p: passcode }).then(function (r) {
        if (r.data === true) { canWrite = true; } else { passcode = ''; try { localStorage.removeItem('sched.pass'); } catch (e) { /* 무시 */ } }
        updateLock();
        renderNote();
      }, function () {});
    }
  }

  try { compact = localStorage.getItem('cal.compact') === '1'; } catch (e) { compact = false; }
  $('cmp').checked = compact;
  buildEditorOnce();
  fromHash();
  wire();
  render();
  start();
})();
</script>
</body>
</html>
